services:
  site:
    image: ruby:3.2
    working_dir: /site
    command: >
      bash -lc "bundle config set path vendor/bundle &&
      bundle install &&
      bundle exec jekyll serve
      --config _config.yml,_config.dev.yml
      --host 0.0.0.0
      --port 4000
      --livereload
      --livereload-port 35729
      --incremental"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/site
      - bundle-cache:/site/vendor/bundle

volumes:
  bundle-cache:
