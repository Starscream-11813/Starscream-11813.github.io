<script>
window.SISYFIG=(function(){

const V=(x,y)=>({x,y}),add=(a,b)=>V(a.x+b.x,a.y+b.y),sub=(a,b)=>V(a.x-b.x,a.y-b.y),mul=(a,k)=>V(a.x*k,a.y*k),len=a=>Math.hypot(a.x,a.y),lerp=(a,b,t)=>a+(b-a)*t,lerpV=(a,b,t)=>V(lerp(a.x,b.x,t),lerp(a.y,b.y,t)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),norm=a=>{const l=len(a)||1;return V(a.x/l,a.y/l);};

const PROF=[[0,7.6,9],[0.3,6.9,7.4],[0.56,8.8,8.4],[0.8,12.2,10.4],[1,9.4,8.8]];

<script>
(function(){

const Q=new URLSearchParams(location.search);

const SPEED=Math.min(4,Math.max(0.2,parseFloat(Q.get('speed'))||1));
const R=132,HEADR=FIG.HEADR,NECK=9,TORSO=58,A1=35,A2=33;

const V=(x,y)=>({x,y}),add=(a,b)=>V(a.x+b.x,a.y+b.y),sub=(a,b)=>V(a.x-b.x,a.y-b.y),mul=(a,k)=>V(a.x*k,a.y*k),len=a=>Math.hypot(a.x,a.y),dir=t=>V(Math.cos(t),Math.sin(t)),lerp=(a,b,t)=>a+(b-a)*t,lerpV=(a,b,t)=>V(lerp(a.x,b.x,t),lerp(a.y,b.y,t)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const bc=xc=>{const s=slope(xc),n=norm(V(-s,1));return add(V(xc,ground(xc)),mul(n,R));};
let BC;{let lo=-500,hi=-80;for(let k=0;k<40;k++){const m=(lo+hi)/2;if(len(sub(bc(m),BT))>R-1)lo=m;else hi=m;}BC=bc((lo+hi)/2);}

const RNG=mulberry(777);

  const t=(S.t+=dt);

  const chin=add(head,mul(dir(ha-1.9),HEADR*0.92));

  const hF=add(add(bp,mul(dir(ba),-13)),V(0,-3));

function scene(W,H){

  const stars=STARS.map(st=>({x:st.x,y:st.y,m:st.m,b:st.fl?(0.5+0.5*Math.sin(t*st.sp*3+st.ph))*(0.65+0.35*Math.sin(t*7.3+st.ph*2)):0.62+0.38*Math.sin(t*st.sp+st.ph)}));
  let shoot=null;if(S.shoot){const q=S.shoot,hd=add(V(q.x,q.y),mul(q.d,q.sp*q.age)),tl=Math.min(190,q.sp*q.age),u=q.age/q.life;shoot={hx:hd.x,hy:hd.y,tx:hd.x-q.d.x*tl,ty:hd.y-q.d.y*tl,a:Math.sin(Math.PI*clamp(u,0,1))};}
  let bird=null;if(S.bird){const b=S.bird,gl=Math.sin(b.age*1.3+b.ph)>0.35;bird={x:b.x,y:b.y0+Math.sin(b.age*0.9+b.ph)*14,flap:gl?0.25:Math.sin(b.age*11),dir:Math.sign(b.vx)};}
  return Object.assign({t,s,W,H,cx,cy,vw:w,vh,x0:cx-w/2,x1:cx+w/2,y0:cy-vh/2,y1:cy+vh/2,C:BC,R,ang:0.35,stars,shoot,bird,moon:MOON,horizon:HORIZON,chair:CHAIR},p);
}
let dpr=1;
const E={R,HEADR,ground,slope,rnd,mulberry,V,add,sub,mul,dir,norm,clamp,Q,capsule:FIG.capsule,circ:FIG.circ,drawFigure:FIG.drawFigure,bgColor:ST.bg,
  dots:()=>DOTS,
  chairPath(ctx,sc,k){k=k||1;const c=sc.chair;ctx.beginPath();FIG.capsule(ctx,c.legB[0],c.legB[1],2.6*k,2.1*k);FIG.capsule(ctx,c.legF[0],c.legF[1],2.6*k,2.1*k);FIG.capsule(ctx,c.post[0],c.post[1],2.8*k,2.6*k);FIG.capsule(ctx,c.panel[0],c.panel[1],5.6*k,5*k);FIG.capsule(ctx,c.seat[0],c.seat[1],3.4*k,3.4*k);},
  book(ctx,sc,o){const b=sc.book,L=19,c=Math.cos(b.ang),s=Math.sin(b.ang),P=(u,v)=>V(b.p.x+u*c-v*s,b.p.y+u*s+v*c);
    ctx.beginPath();ctx.moveTo(P(-L-1.5,-1.5).x,P(-L-1.5,-1.5).y);ctx.lineTo(P(L+1.5,-1.5).x,P(L+1.5,-1.5).y);ctx.lineTo(P(L+1.5,0.5).x,P(L+1.5,0.5).y);ctx.lineTo(P(-L-1.5,0.5).x,P(-L-1.5,0.5).y);ctx.closePath();ctx.fillStyle=o.cover;ctx.fill();
    const page=(sg)=>{ctx.beginPath();ctx.moveTo(P(0,0).x,P(0,0).y);ctx.quadraticCurveTo(P(sg*L*0.5,5.5).x,P(sg*L*0.5,5.5).y,P(sg*L,2.2).x,P(sg*L,2.2).y);ctx.lineTo(P(sg*L,0).x,P(sg*L,0).y);ctx.closePath();ctx.fillStyle=o.page;ctx.fill();if(o.line){ctx.strokeStyle=o.line;ctx.lineWidth=o.lw;ctx.stroke();}};
    page(-1);page(1);
    if(b.flip>=0){const e=ss(b.flip),a=Math.PI*e,end=P(Math.cos(a)*L*(1-0.12*Math.sin(a)),2+Math.sin(a)*L*0.9),cp=P(Math.cos(a-0.5*Math.sin(a))*L*0.55,3+Math.sin(a+0.3)*L*0.6);
      ctx.beginPath();ctx.moveTo(P(0,0.5).x,P(0,0.5).y);ctx.quadraticCurveTo(cp.x,cp.y,end.x,end.y);ctx.strokeStyle=o.flipCol||o.line||o.page;ctx.lineWidth=o.flipW||o.lw*1.4;ctx.lineCap='round';ctx.stroke();}},
  world:(ctx,sc)=>ctx.setTransform(sc.s*dpr,0,0,-sc.s*dpr,(sc.W/2-sc.cx*sc.s)*dpr,(sc.H/2+sc.cy*sc.s)*dpr),
  screen:ctx=>ctx.setTransform(dpr,0,0,dpr,0,0),
  toS:(sc,p)=>V(sc.W/2+(p.x-sc.cx)*sc.s,sc.H/2-(p.y-sc.cy)*sc.s)};

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=1,H=1;
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,cv.clientWidth);H=Math.max(1,cv.clientHeight);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
function draw(){
  const sc=scene(W,H);E.screen(ctx);ctx.clearRect(0,0,W,H);
  E.dark=isDark();const dbg=E.dark&&ST.bgDark?ST.bgDark:ST.bg,bg=Q.get('bg')||dbg;E.bgColor=bg==='transparent'?dbg:bg;if(bg!=='transparent'){ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);}
  ST.render(ctx,sc,E);
}
resize();
const still=Q.get('still')==='1'||(Q.get('still')!=='0'&&window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const DT=1/60;
draw();
window.addEventListener('resize',()=>{resize();draw();});
if(window.ResizeObserver)new ResizeObserver(()=>{if(cv.clientWidth!==W||cv.clientHeight!==H){resize();draw();}}).observe(cv);
window.__sisyphus={advance(sec){for(let i=0;i<sec*60;i++)step(DT);draw();},state:S};
if(still)return;
let last=performance.now(),acc=0,paused=false,visible=true;
if(window.IntersectionObserver)new IntersectionObserver(es=>{visible=es[es.length-1].isIntersecting;last=performance.now();}).observe(cv);
cv.addEventListener('click',()=>{paused=!paused;last=performance.now();});
function frame(now){
  if(cv.clientWidth&&(cv.clientWidth!==W||cv.clientHeight!==H))resize();
  const d=Math.min(0.1,(now-last)/1000)*SPEED;last=now;
  if(!paused&&visible&&!document.hidden){acc+=d;while(acc>=DT){step(DT);acc-=DT;}draw();}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
