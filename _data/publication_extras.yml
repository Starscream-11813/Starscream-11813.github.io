# The small venue label above each title on the Publications page, keyed by
# each paper's permalink. Everything else (title, authors, venue line, notes,
# links, BibTeX) stays in _publications/.
#   short:  the paper's short name, used for accessible labels
#   venue:  a compact venue label, e.g. "IJCNLP-AACL 2026"
#   kind:   the track, shown after the venue (Main, Findings, Workshop, ...)
#   themes: what the paper studies about LLMs: reason, create, and/or behave
#           (the filter above the Publications list; papers without one
#           show only under "all").
# A paper without an entry shows its full venue; preprints show "Preprint".

