# Topic menus in the About page.
# Add a paper using its permalink from _publications/*.md. The menu reads its
# full title and pdfurl from that entry, so those details stay in one place.
# name is optional: omit it to display the full paper title.
# A paper may be listed under more than one topic. Entries without a PDF are
# omitted until their publication entry has a pdfurl.

