<meta charset="utf-8">

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<script>
  (function() {
    var theme = 'light';

    try {
      var storedTheme = localStorage.getItem('site-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

      theme = storedTheme || (prefersDark ? 'dark' : 'light');
    } catch (error) {
      theme = 'light';
    }

    document.documentElement.setAttribute('data-theme', theme);
  }());

  /* Arriving from another page of the site in a view transition (see
     _page-transitions.scss), skip the theme's staged fade-in, so the page
     cross-fades in one smooth step. A first visit still fades in. */
  window.addEventListener('pagereveal', function(event) {
    if (event.viewTransition) {
      document.documentElement.classList.add('is-transition-arrival');
    }
  });
</script>

<!-- Chrome and Edge start loading a page of the site once its link is hovered
     or about to be tapped, so the click opens it at once. Files, images, and
     links that open elsewhere are left alone. -->
<script type="speculationrules">
{
  "prerender": [{
    "where": {
      "and": [
        { "href_matches": "/*" },
        { "not": { "href_matches": ["/files/*", "/images/*", "/assets/*", "/*.pdf", "/*.xml", "/*.zip"] } },
        { "not": { "selector_matches": "[target=_blank], [download], [rel~=nofollow]" } }
      ]
    },
    "eagerness": "moderate"
  }]
}
</script>
