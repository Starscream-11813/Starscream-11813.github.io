<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script>
  /* MathJax is large, so it loads only on pages whose text has math in it,
     found the way MathJax looks for it (skipping code and scripts). The
     production build puts each page on one line, so no line comments here. */
  document.addEventListener('DOMContentLoaded', function() {
    var math = /\$[^$\s][^$]*\$|\\\(|\\\[/;
    var skip = /^(SCRIPT|NOSCRIPT|STYLE|TEXTAREA|PRE|CODE)$/;
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function(node) {
        return skip.test(node.parentNode.nodeName) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
      }
    });

    while (walker.nextNode()) {
      if (math.test(walker.currentNode.nodeValue)) {
        var script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-MML-AM_CHTML';
        script.async = true;
        document.head.appendChild(script);
        return;
      }
    }
  });
</script>
